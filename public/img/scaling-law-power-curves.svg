<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Kaplan 语言模型缩放律的对数坐标示意</title>
  <desc id="desc">参数量、数据量和最小训练计算量增加时，测试损失按幂律平滑下降；三条曲线在双对数坐标中近似为直线。</desc>
  <rect width="1200" height="700" fill="#ffffff" />
  <rect x="32" y="32" width="1136" height="636" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="2" />

  <text x="84" y="92" fill="#202124" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Scaling Law：双对数坐标下的直线</text>
  <text x="84" y="126" fill="#5f6368" font-family="Inter, Arial, sans-serif" font-size="17">资源增加带来稳定但递减的损失改善；斜率绝对值就是幂律指数</text>

  <g stroke="#e8eaed" stroke-width="1">
    <line x1="160" y1="180" x2="160" y2="560" />
    <line x1="370" y1="180" x2="370" y2="560" />
    <line x1="580" y1="180" x2="580" y2="560" />
    <line x1="790" y1="180" x2="790" y2="560" />
    <line x1="1000" y1="180" x2="1000" y2="560" />
    <line x1="160" y1="180" x2="1000" y2="180" />
    <line x1="160" y1="275" x2="1000" y2="275" />
    <line x1="160" y1="370" x2="1000" y2="370" />
    <line x1="160" y1="465" x2="1000" y2="465" />
    <line x1="160" y1="560" x2="1000" y2="560" />
  </g>

  <g stroke="#80868b" stroke-width="2">
    <line x1="160" y1="160" x2="160" y2="560" />
    <line x1="160" y1="560" x2="1024" y2="560" />
  </g>

  <text x="76" y="366" fill="#5f6368" font-family="Inter, Arial, sans-serif" font-size="16" transform="rotate(-90 76 366)">测试损失 L（log，越低越好）</text>
  <text x="468" y="625" fill="#5f6368" font-family="Inter, Arial, sans-serif" font-size="16">资源规模 N / D / C（log）</text>
  <text x="145" y="590" fill="#80868b" font-family="Inter, Arial, sans-serif" font-size="13">小</text>
  <text x="994" y="590" fill="#80868b" font-family="Inter, Arial, sans-serif" font-size="13">大</text>

  <path d="M180 226 L980 498" fill="none" stroke="#4285f4" stroke-width="8" stroke-linecap="round" />
  <path d="M180 196 L980 535" fill="none" stroke="#34a853" stroke-width="8" stroke-linecap="round" />
  <path d="M180 272 L980 454" fill="none" stroke="#ea4335" stroke-width="8" stroke-linecap="round" />

  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="760" y="192" width="300" height="42" rx="6" fill="#e8f0fe" />
    <circle cx="785" cy="213" r="6" fill="#4285f4" />
    <text x="802" y="219" fill="#174ea6">参数量 N：αN ≈ 0.076</text>

    <rect x="760" y="242" width="300" height="42" rx="6" fill="#e6f4ea" />
    <circle cx="785" cy="263" r="6" fill="#34a853" />
    <text x="802" y="269" fill="#137333">数据量 D：αD ≈ 0.095</text>

    <rect x="760" y="292" width="300" height="42" rx="6" fill="#fce8e6" />
    <circle cx="785" cy="313" r="6" fill="#ea4335" />
    <text x="802" y="319" fill="#a50e0e">计算量 Cmin：αC ≈ 0.050</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="180" y="466" width="340" height="62" rx="6" fill="#f8f9fa" stroke="#dadce0" />
    <text x="200" y="492" fill="#202124" font-size="16" font-weight="700">指数远小于 1</text>
    <text x="200" y="516" fill="#5f6368" font-size="15">规模继续增大仍有效，但成本增长快于收益</text>
  </g>
</svg>
